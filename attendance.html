<!DOCTYPE html>
<!--
  出勤明細頁（放 GitHub Pages）
  用 JSONP 向 Apps Script 撈打卡紀錄，依員工 + 週次顯示日期/上班/下班。
  上傳前只要改下方 CONFIG 的 WEB_APP_URL（跟 index.html 用同一個 /exec 網址）。
-->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出勤明細</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #fff; color: #333;
    }
    /* 標題列 */
    .topbar {
      background: #3f9bf5; color: #fff;
      display: flex; align-items: center; justify-content: center;
      position: relative; height: 52px; font-size: 18px; font-weight: 600;
    }
    .topbar .menu { position: absolute; right: 16px; font-size: 20px; }
    /* 員工選單 + 週切換列 */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      background: #eef3f8; border-bottom: 1px solid #e2e8f0;
      padding: 8px 12px; font-size: 13px; color: #555;
    }
    .navbtn {
      background: none; border: none; color: #3f9bf5; font-size: 13px;
      cursor: pointer; padding: 4px 6px; white-space: nowrap;
    }
    .navbtn:disabled { color: #bcc7d3; cursor: default; }
    .range { flex: 1; text-align: center; color: #444; letter-spacing: .3px; }
    .picker { padding: 8px 12px; border-bottom: 1px solid #eef1f4; }
    .picker select {
      width: 100%; padding: 8px 10px; font-size: 14px;
      border: 1px solid #d7dee6; border-radius: 8px; background: #fff; color: #333;
    }
    /* 表格 */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: 15px; font-weight: 700; color: #222; padding: 12px 8px;
      border-bottom: 2px solid #e6eaef;
    }
    tbody td { font-size: 14px; color: #444; padding: 14px 8px; text-align: center; }
    tbody td.date { color: #333; }
    tbody tr:nth-child(odd) { background: #f6f8fa; }
    tbody tr:nth-child(even) { background: #fff; }
    th.c-date, td.c-date { width: 44%; }
    th.c-in, td.c-in, th.c-out, td.c-out { width: 28%; }
    .empty { text-align: center; color: #999; padding: 40px 16px; font-size: 14px; }
    .loading { text-align: center; color: #999; padding: 40px 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="topbar">
    打卡紀錄
  </div>

  <div class="picker">
    <select id="who"><option value="">載入中…</option></select>
  </div>

  <div class="toolbar">
    <button class="navbtn" id="prev">‹ 上一月</button>
    <span class="range" id="range">—</span>
    <button class="navbtn" id="next">下一月 ›</button>
  </div>

  <table>
    <thead>
      <tr>
        <th class="c-date">日期</th>
        <th class="c-in">上班</th>
        <th class="c-out">下班</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="3" class="loading" id="status">資料載入中…</td></tr>
    </tbody>
  </table>

  <script>
    /*************** CONFIG — 上傳前請填入 ***************/
    // 跟 index.html 一樣，用 Apps Script 部署的 /exec 網址
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbypJPX4bjGbXvDZfqXcdmI-7Im3L-XDIHoKCeO4ns9y31zdbsXmZiUU0fPjoseCV--RyA/exec';
    /****************************************************/

    const $ = (id) => document.getElementById(id);
    let allRecords = [];   // 全部打卡紀錄
    let names = [];        // 員工名單
    let monthOffset = 0;   // 0=本月，-1=上一月，+1=下一月

    // ── 月份工具 ──
    // 回傳套用 offset 後的 {y, m}（m 為 1~12）
    function targetMonth() {
      const now = new Date();
      const d = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
      return { y: d.getFullYear(), m: d.getMonth() + 1 };
    }
    // 該月份的字首，例如 '2026-08'
    function monthPrefix(t) {
      return t.y + '-' + String(t.m).padStart(2, '0');
    }

    // ── JSONP 撈資料 ──
    function loadData() {
      const cbName = 'cb_' + Date.now();
      const s = document.createElement('script');
      window[cbName] = function (data) {
        try { onData(data || []); } finally { delete window[cbName]; s.remove(); }
      };
      s.onerror = function () {
        $('status').textContent = '❌ 讀取失敗，請確認 WEB_APP_URL 與部署設定';
        delete window[cbName]; s.remove();
      };
      s.src = WEB_APP_URL + '?callback=' + cbName + '&t=' + Date.now();
      document.body.appendChild(s);
    }

    function onData(data) {
      allRecords = data;
      names = [...new Set(data.map((r) => r.name).filter(Boolean))].sort();
      const sel = $('who');
      // 第一個選項是預設提示「員工姓名」（value 空字串），選了才顯示該員工資料
      const placeholder = '<option value="">員工姓名</option>';
      sel.innerHTML = placeholder + names.map((n) => `<option value="${n}">${n}</option>`).join('');
      render();
    }

    // 把某員工的打卡紀錄「配對」成一段段班別（上班 → 之後的下班）。
    // 跨午夜也能正確配對：下班算回上班那天，隔天凌晨的下班不會漏掉。
    function buildSessions(name) {
      const recs = allRecords
        .filter((r) => r.name === name)
        .map((r) => ({ type: r.type, date: r.date, time: r.time, key: r.date + ' ' + r.time }))
        .sort((a, b) => (a.key < b.key ? -1 : a.key > b.key ? 1 : 0)); // 依時間先後

      const sessions = [];
      let open = null;
      recs.forEach((r) => {
        const isIn = r.type.indexOf('上') > -1;
        const isOut = r.type.indexOf('下') > -1;
        if (isIn) {
          if (open) sessions.push(open); // 前一段只有上班沒下班，先收起來
          open = { date: r.date, inTime: r.time, outTime: null, outDate: null };
        } else if (isOut) {
          if (open) {
            open.outTime = r.time; open.outDate = r.date;
            sessions.push(open); open = null;
          } else {
            // 只有下班、沒有對應的上班
            sessions.push({ date: r.date, inTime: null, outTime: r.time, outDate: r.date });
          }
        }
      });
      if (open) sessions.push(open);
      return sessions;
    }

    // ── 渲染表格 ──
    function render() {
      const name = $('who').value;
      const t = targetMonth();
      const prefix = monthPrefix(t);           // 例如 '2026-08'
      $('range').textContent = t.y + '年' + String(t.m).padStart(2, '0') + '月';
      $('next').disabled = monthOffset >= 0;    // 不看未來月

      const tbody = $('rows');

      // 還沒選員工 → 提示
      if (!name) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">請先在上方選擇員工</td></tr>';
        return;
      }

      // 以「上班日」歸屬月份（跨夜下班仍算在上班那天），再由新到舊排序
      const sessions = buildSessions(name)
        .filter((s) => s.date.slice(0, 7) === prefix)
        .sort((a, b) => {
          const ka = a.date + (a.inTime || a.outTime || '');
          const kb = b.date + (b.inTime || b.outTime || '');
          return ka < kb ? 1 : ka > kb ? -1 : 0;
        });

      if (sessions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">本月沒有打卡紀錄</td></tr>';
        return;
      }
      tbody.innerHTML = sessions.map((s) => {
        // 下班若是隔天（跨午夜），標註「(隔日)」
        let out = s.outTime || '—';
        if (s.outTime && s.outDate && s.outDate !== s.date) out = s.outTime + '（隔日）';
        return `<tr>
          <td class="c-date date">${s.date}</td>
          <td class="c-in">${s.inTime || '—'}</td>
          <td class="c-out">${out}</td>
        </tr>`;
      }).join('');
    }

    // ── 事件 ──
    $('prev').addEventListener('click', () => { monthOffset -= 1; render(); });
    $('next').addEventListener('click', () => { if (monthOffset < 0) { monthOffset += 1; render(); } });
    $('who').addEventListener('change', render);

    loadData();
  </script>
</body>
</html>
